<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fakturaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#fakturaGrad)" filter="url(#glow)" />

  <!-- Inner subtle border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />

  <!-- Stylized Document Shape -->
  <g transform="translate(14, 11)">
    <!-- Document Base with folded corner -->
    <path d="M4 0 L24 0 L34 10 L34 38 C34 40.2 32.2 42 30 42 L4 42 C1.8 42 0 40.2 0 38 L0 4 C0 1.8 1.8 0 4 0 Z" fill="#ffffff" />
    
    <!-- Folded corner tab -->
    <path d="M24 0 L24 10 L34 10 Z" fill="#cbd5e1" />
    
    <!-- Invoice text lines -->
    <rect x="6" y="15" width="16" height="3" rx="1.5" fill="#4f46e5" />
    <rect x="6" y="22" width="22" height="2.5" rx="1.25" fill="#94a3b8" />
    <rect x="6" y="28" width="14" height="2.5" rx="1.25" fill="#94a3b8" />
    
    <!-- High-speed lightning spark / check badge -->
    <circle cx="27" cy="35" r="7.5" fill="#10b981" />
    <path d="M24 35 L26 37 L30 33" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
